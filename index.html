<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>What does getting around really cost?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="lang-switch" role="group" data-i18n-attr="aria-label: language.label">
        <button type="button" data-lang="nl" lang="nl" aria-label="Nederlands">NL</button>
        <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
      </div>
      <h1 data-i18n="page.title">What does getting around really cost?</h1>
      <p class="lede" data-i18n="page.lede"></p>
      <div class="plate" aria-live="polite">
        <span class="plate-band" aria-hidden="true">NL</span>
        <span class="plate-amount" id="heroAmount">€0</span>
      </div>
      <p class="hero-caption" id="heroCaption"></p>
    </div>
  </header>

  <div class="layout">
    <aside class="controls" data-i18n-attr="aria-label: settings.label">
      <div id="settings"></div>

      <fieldset>
        <legend data-i18n="vehicles.title">Vehicles</legend>
        <div class="field">
          <label for="reference" data-i18n="vehicles.reference">Compare with</label>
          <select id="reference"></select>
        </div>
        <ul class="vehicle-list" id="vehicleList"></ul>
        <button type="button" id="addVehicle" class="button primary wide" data-i18n="vehicles.add">Add vehicle</button>
      </fieldset>

      <fieldset>
        <legend data-i18n="data.title">Your data</legend>
        <p class="hint" data-i18n="data.saved"></p>
        <div class="button-row">
          <button type="button" id="exportData" class="button" data-i18n="data.export">Export</button>
          <button type="button" id="importData" class="button" data-i18n="data.import">Import</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
        <button type="button" id="reset" class="button wide" data-i18n="data.reset">Reset to defaults</button>
      </fieldset>
    </aside>

    <main>
      <section aria-labelledby="rankTitle">
        <h2 id="rankTitle" data-i18n="ranking.title">Ranking</h2>
        <p class="sub" id="rankSub"></p>
        <div class="table-wrap">
          <table class="ranking">
            <thead>
              <tr>
                <th scope="col" data-i18n="ranking.option">Option</th>
                <th scope="col" data-i18n="ranking.total">Total</th>
                <th scope="col" class="wide-only" data-i18n="ranking.perMonth">Per month</th>
                <th scope="col" class="wide-only" data-i18n="ranking.perKm">Per km</th>
                <th scope="col" id="rankVersus"></th>
              </tr>
            </thead>
            <tbody id="rankBody"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="lineTitle">
        <h2 id="lineTitle" data-i18n="lineChart.title">Money spent over time</h2>
        <p class="sub" data-i18n="lineChart.sub"></p>
        <div class="legend" id="lineLegend"></div>
        <div class="chart chart-line"><canvas id="lineChart" role="img" data-i18n-attr="aria-label: lineChart.label"></canvas></div>
      </section>

      <section aria-labelledby="distanceTitle">
        <h2 id="distanceTitle" data-i18n="distanceChart.title">Cost by distance</h2>
        <p class="sub" id="distanceSub"></p>
        <div class="legend" id="distanceLegend"></div>
        <div class="chart chart-line"><canvas id="distanceChart" role="img" data-i18n-attr="aria-label: distanceChart.label"></canvas></div>
        <ul class="notes" id="breakEven"></ul>
      </section>

      <section aria-labelledby="barTitle">
        <h2 id="barTitle" data-i18n="barChart.title">Where the money goes</h2>
        <div class="legend" id="barLegend"></div>
        <div class="chart chart-bar"><canvas id="barChart" role="img" data-i18n-attr="aria-label: barChart.label"></canvas></div>
        <ul class="notes" id="notes"></ul>
      </section>

      <section aria-labelledby="aboutTitle" class="about">
        <h2 id="aboutTitle" data-i18n="about.title">How this is calculated</h2>
        <p data-i18n="about.method"></p>
        <p data-i18n="about.money"></p>
        <p data-i18n="about.blocks"></p>
        <p data-i18n="about.caveat"></p>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    WielPrijs <span id="version"></span> · <span data-i18n="data.privacy"></span>
  </footer>

  <dialog id="templates" class="dialog" aria-labelledby="templatesTitle">
    <form method="dialog">
      <header class="dialog-header">
        <h2 id="templatesTitle" data-i18n="templates.title">Add a vehicle</h2>
        <p class="sub" data-i18n="templates.intro"></p>
      </header>
      <div class="dialog-body template-list" id="templateList"></div>
      <footer class="dialog-footer">
        <span class="spacer"></span>
        <button class="button" value="cancel" data-i18n="editor.cancel">Cancel</button>
      </footer>
    </form>
  </dialog>

  <dialog id="editor" class="dialog dialog-wide" aria-labelledby="editorTitle">
    <form method="dialog" id="editorForm" novalidate>
      <header class="dialog-header">
        <h2 id="editorTitle"></h2>
      </header>
      <div class="dialog-body">
        <div class="editor-basics">
          <div class="field">
            <label for="vehicleName" data-i18n="editor.name">Name</label>
            <input type="text" id="vehicleName" autocomplete="off">
          </div>
          <div class="field">
            <label for="vehicleColor" data-i18n="editor.color">Colour</label>
            <input type="color" id="vehicleColor">
          </div>
          <div class="field">
            <label for="vehicleLine" data-i18n="editor.line">Line</label>
            <select id="vehicleLine"></select>
          </div>
        </div>
        <div class="blocks" id="editorBlocks"></div>
        <div class="field add-block">
          <label for="addBlock" data-i18n="editor.addBlock">Add a cost</label>
          <select id="addBlock"></select>
        </div>
      </div>
      <footer class="dialog-footer">
        <button type="button" id="deleteVehicle" class="button danger" data-i18n="editor.delete">Delete</button>
        <button type="button" id="saveCopy" class="button" data-i18n="editor.saveCopy">Save as copy</button>
        <span class="spacer"></span>
        <button type="button" id="cancelEdit" class="button" data-i18n="editor.cancel">Cancel</button>
        <button type="submit" class="button primary" data-i18n="editor.save">Save</button>
      </footer>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="js/wielprijs.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/locales/en.js"></script>
  <script src="js/locales/nl.js"></script>
  <script src="js/store.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/blocks/purchase.js"></script>
  <script src="js/blocks/insurance.js"></script>
  <script src="js/blocks/road-tax.js"></script>
  <script src="js/blocks/energy.js"></script>
  <script src="js/blocks/maintenance.js"></script>
  <script src="js/blocks/battery.js"></script>
  <script src="js/blocks/lease.js"></script>
  <script src="js/blocks/transit.js"></script>
  <script src="js/blocks/extra.js"></script>
  <script src="js/model.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/results.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
